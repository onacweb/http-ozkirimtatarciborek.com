name: Siteyi Yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Paketleri kur
        run: npm ci

      - name: Siteyi hazırla
        run: npm run build

      - name: Pages ayarla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
